@if (authenticatedAsExpert()) {
	<button
		mat-icon-button
		type="button"
		class="message-action"
		[matTooltip]="'edit.answer' | translate"
		[attr.aria-label]="'edit.answer' | translate"
		(click)="openFaqItemDialog()"
	>
		<mat-icon svgIcon="pencil"></mat-icon>
	</button>
}
<button
	mat-icon-button
	type="button"
	class="message-action"
	[matTooltip]="'good.answer' | translate"
	[attr.aria-label]="'good.answer' | translate"
	(click)="openFeedbackDialog(true)"
>
	<mat-icon svgIcon="thumbs_up"></mat-icon>
</button>
<button
	mat-icon-button
	type="button"
	class="message-action"
	[matTooltip]="'bad.answer' | translate"
	[attr.aria-label]="'bad.answer' | translate"
	(click)="openFeedbackDialog(false)"
>
	<mat-icon svgIcon="thumbs_down"></mat-icon>
</button>
<button
	mat-icon-button
	type="button"
	class="message-action"
	[class.being-spoken]="beingSpoken()"
	[matTooltip]="'read.aloud' | translate"
	[attr.aria-label]="'read.aloud' | translate"
	[attr.aria-pressed]="beingSpoken()"
	(click)="speak()"
>
	<mat-icon [svgIcon]="beingSpoken() ? 'volume_muted' : 'volume_high'"></mat-icon>
</button>
<button
	mat-icon-button
	type="button"
	class="message-action"
	[matTooltip]="'copy.answer' | translate"
	[attr.aria-label]="'copy.answer' | translate"
	(click)="copyAnswer()"
>
	<mat-icon svgIcon="copy"></mat-icon>
</button>
@if (regenerable) {
	<button
		mat-icon-button
		type="button"
		class="message-action"
		[matTooltip]="'chat.answer.regenerate' | translate"
		[attr.aria-label]="'chat.answer.regenerate' | translate"
		(click)="regenerate.emit()"
	>
		<mat-icon svgIcon="refresh"></mat-icon>
	</button>
}
<ng-template #addFaqItemDialog>
	<h4 mat-dialog-title>{{ "edit.question.answer" | translate }}</h4>
	<div mat-dialog-content class="mt16" ngForm>
		<zco-faq-item-edit class="mt16" [formControl]="faqItemFrmCtrl"></zco-faq-item-edit>
	</div>
	<div mat-dialog-actions>
		<button class="red-button" mat-button [obButton]="'secondary'" matDialogClose>
			<mat-icon svgIcon="xmark"></mat-icon>
			{{ "cancel" | translate }}
		</button>
		<button mat-button [obButton]="'primary'" [mat-dialog-close]="true">
			<mat-icon svgIcon="checkmark"></mat-icon>
			{{ "confirm" | translate }}
		</button>
	</div>
</ng-template>

<ng-template #feedbackDialog>
	<h4 mat-dialog-title>{{ feedBackTitle | translate }}</h4>
	<div mat-dialog-content class="mt16" ngForm>
		@if (isNegativeFeedback) {
			<mat-radio-group [formControl]="categoryFrmCtrl" class="feedback-category-group" aria-label="feedback category">
				@for (cat of answerFeedbackCategories; track cat) {
					<mat-radio-button [value]="cat">
						{{ "feedback.category." + cat | translate }}
					</mat-radio-button>
				}
			</mat-radio-group>
		}
		<textarea [formControl]="feedbackFrmCtrl" placeholder="{{ 'feedback.comment.placeholder' | translate }}"></textarea>
	</div>
	<div mat-dialog-actions>
		<button class="red-button" mat-button [obButton]="'secondary'" matDialogClose>
			<mat-icon svgIcon="xmark"></mat-icon>
			{{ "cancel" | translate }}
		</button>
		<button mat-button [obButton]="'primary'" [mat-dialog-close]="true">
			<mat-icon svgIcon="checkmark"></mat-icon>
			{{ "send" | translate }}
		</button>
	</div>
</ng-template>

<div *ngIf="message.source === ChatMessageSource.USER">
	<ng-container *ngIf="!editing; else editForm">
		<markdown class="no-margin" [data]="message.message"></markdown>
		<zco-workspace-badge
			*ngIf="message.workspace"
			[workspaceName]="message.workspace"
			[question]="message.message"
			(workspaceChange)="workspaceChange.emit($event)"
		></zco-workspace-badge>
		<div *ngIf="replayable" class="turn-controls">
			<button
				type="button"
				mat-icon-button
				(click)="startEdit()"
				[attr.aria-label]="'chat.question.edit' | translate"
				[title]="'chat.question.edit' | translate"
			>
				<mat-icon svgIcon="pen"></mat-icon>
			</button>
		</div>
	</ng-container>
	<ng-template #editForm>
		<form class="edit-question" (ngSubmit)="submitEdit()">
			<textarea
				class="edit-question-input"
				name="editedQuestion"
				[(ngModel)]="editedQuestion"
				[attr.aria-label]="'chat.question.edit' | translate"
				(keydown.escape)="cancelEdit()"
				cdkTextareaAutosize
			></textarea>
			<div class="turn-controls">
				<button
					type="submit"
					mat-icon-button
					[disabled]="!editedQuestion.trim()"
					[attr.aria-label]="'chat.question.edit.submit' | translate"
					[title]="'chat.question.edit.submit' | translate"
				>
					<mat-icon svgIcon="checkmark"></mat-icon>
				</button>
				<button
					type="button"
					mat-icon-button
					(click)="cancelEdit()"
					[attr.aria-label]="'chat.question.edit.cancel' | translate"
					[title]="'chat.question.edit.cancel' | translate"
				>
					<mat-icon svgIcon="cancel"></mat-icon>
				</button>
			</div>
		</form>
	</ng-template>
</div>
<div *ngIf="message.source !== ChatMessageSource.USER">
	<div class="flex-column">
		<markdown class="markdown-content" [data]="message.message"></markdown>

		<mat-expansion-panel *ngIf="hasMultipleSources" class="sources-panel" (opened)="sourcePanelOpen = true" (closed)="sourcePanelOpen = false">
			<mat-expansion-panel-header>
				<mat-panel-title> Sources ({{ sourcesCount }}) </mat-panel-title>
			</mat-expansion-panel-header>

			<zco-source-list
				[message]="message"
				[question]="previousMessage?.message"
				[conversationId]="conversationId"
				[expanded]="sourcePanelOpen"
			></zco-source-list>
		</mat-expansion-panel>

		<div *ngIf="message.interrupted || replayable" class="turn-controls">
			<span *ngIf="message.interrupted" class="interrupted-badge">{{ "chat.answer.interrupted" | translate }}</span>
			<button
				*ngIf="replayable"
				type="button"
				mat-icon-button
				(click)="regenerate.emit()"
				[attr.aria-label]="'chat.answer.regenerate' | translate"
				[title]="'chat.answer.regenerate' | translate"
			>
				<mat-icon svgIcon="refresh"></mat-icon>
			</button>
		</div>

		<zco-message-action
			[hidden]="!message.isCompleted || message.inError || (message.interrupted && !message.id)"
			[message]="message"
			[previousMessage]="previousMessage"
			(feedback)="sendFeedback($event)"
		></zco-message-action>
	</div>
</div>

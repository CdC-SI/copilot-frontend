<mat-list role="list" class="history-list">
	<mat-list-item
		[class]="title.selected ? 'title-selected' : 'title'"
		[class.llm-only]="title.type === 'NO_RAG'"
		role="listitem"
		*ngFor="let title of titles"
		[matTooltip]="title.title"
		matTooltipPosition="right"
		[matTooltipShowDelay]="400"
	>
		<div class="history-item">
			<ng-container *ngIf="editingTitle !== title; else editMode">
				<mat-icon class="type-icon" [svgIcon]="getTypeIcon(title)" [matTooltip]="getTypeLabel(title) | translate" matTooltipPosition="above"></mat-icon>
				<div class="history-item-body" (click)="titleSelected(title)">
					<span class="history-item-title">{{ title.title }}</span>
					<span class="history-item-date">{{ title.timestamp | date: "d MMM, HH:mm" }}</span>
				</div>
				<div class="actions">
					<button mat-icon-button (click)="startRename(title, $event)" [attr.aria-label]="'chat.history.rename' | translate">
						<mat-icon svgIcon="pen"></mat-icon>
					</button>
					<button mat-icon-button (click)="deleteTitle(title); $event.stopPropagation()" [attr.aria-label]="'chat.history.delete' | translate">
						<mat-icon svgIcon="trash"></mat-icon>
					</button>
				</div>
			</ng-container>
			<ng-template #editMode>
				<mat-icon class="type-icon" [svgIcon]="getTypeIcon(title)"></mat-icon>
				<input
					matInput
					[(ngModel)]="tempTitle"
					(focusout)="cancelRename()"
					(keyup.enter)="saveRename(title)"
					(keyup.escape)="cancelRename()"
					(click)="$event.stopPropagation()"
					#titleInput
				/>
			</ng-template>
		</div>
	</mat-list-item>
</mat-list>

<mat-card class="history-card">
	<div class="sidebar-actions">
		<button type="button" class="new-conversation" (click)="store.newChat()">
			<mat-icon svgIcon="plus" aria-hidden="true"></mat-icon>
			<span>{{ "chat.new-conversation" | translate }}</span>
		</button>
	</div>
	<mat-card-header>
		<mat-card-title>{{ "chat_history" | translate }}</mat-card-title>
	</mat-card-header>
	<mat-card-content>
		@if (store.isRegistered()) {
			<zco-chat-history
				[titles]="store.conversationTitles()"
				(conversationSelected)="store.selectConversation($event)"
				(conversationDeleted)="store.deleteConversation($event)"
				(conversationRenamed)="store.renameConversation($event)"
			></zco-chat-history>
		}
	</mat-card-content>
</mat-card>

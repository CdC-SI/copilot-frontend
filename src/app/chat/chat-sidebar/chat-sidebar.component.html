<mat-card class="history-card">
	<mat-card-header class="flex-row aic jcsb">
		<mat-card-title class="mt16">{{ "chat_history" | translate }}</mat-card-title>
		<button
			mat-icon-button
			[obButton]="'primary'"
			(click)="store.newChat()"
			[matTooltip]="'chat.new-conversation.short-tooltip' | translate"
			[attr.aria-label]="'chat.new-conversation.short-tooltip' | translate"
		>
			<mat-icon svgIcon="plus"></mat-icon>
		</button>
	</mat-card-header>
	<mat-card-content>
		@if (store.isRegistered()) {
			<zco-chat-history
				[titles]="store.conversationTitles()"
				(conversationSelected)="store.selectConversation($event)"
				(conversationDeleted)="store.deleteConversation($event)"
				(conversationRenamed)="store.renameConversation($event)"
			></zco-chat-history>
		}
	</mat-card-content>
</mat-card>
